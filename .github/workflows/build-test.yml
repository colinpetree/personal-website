name: Build and test

# Reusable: builds the site's code on an ARM64 runner (the same CPU and OS as
# production), tests it, packages the release files and uploads them as a
# workflow artifact. It publishes nothing. Called by:
#   - ci.yml       on every push to main, every pull request, and by hand
#                  (trial / test builds of any branch)
#
# Release files it produces (uploaded as artifact `artifact_name`):
#   - server-bundle-v<version>-linux-arm64.tar.gz (+ .sha256): the frozen
#     backend, migrations and deploy files. Each site's private dist repo
#     downloads this and adds its own prerendered frontend
#     (see build-instance.yml).
#   - personal-website-v<version>.tar.gz (+ .sha256): the template build (no
#     prerendered pages, AI demos off), installable on any fresh server.
#   - last-build-requirements.txt, dependency-changes.md
#
# The version is only a label here: it goes into VERSION and the file names.
# Nothing is compiled with it, so release.yml can later relabel a tested
# build as vX.Y.Z (deploy/scripts/reversion-release.sh) without rebuilding.
#
# PyInstaller cannot cross-compile, so the backend must be built on ARM64 to
# run on production's Graviton (t4g) servers.

on:
  workflow_call:
    inputs:
      version:
        description: "Version label for this build, e.g. 0.9.6-ci.abc1234"
        type: string
        required: true
      previous:
        description: "Newest stable release tag (e.g. v0.9.6), the base for the upgrade-migration test and the dependency report. Empty if there is none."
        type: string
        required: false
        default: ""
      artifact_name:
        description: "Name of the workflow artifact holding the release files"
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
      OUT: ${{ github.workspace }}/out
    services:
      # Real Postgres for the migration and fixture tests. Production runs
      # Postgres; SQLite cannot run several of the .sql migrations at all.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-build.txt

      # The repo has no VERSION file: versions come from release tags. This
      # one is read by assemble-release.sh and ends up inside the bundle,
      # where the installed app reads it (backend/version.py).
      - name: Set VERSION for this build
        run: |
          echo "$VERSION" > VERSION
          mkdir -p "$OUT"

      # First, on its own: every package must have an ARM64 wheel (or build
      # from source here). A missing one should fail plainly at this step.
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-build.txt
          # The exact package set frozen into this release; the next release
          # diffs against it, and the dependency audit checks it.
          python -m pip freeze --exclude pyinstaller --exclude pyinstaller-hooks-contrib --exclude altgraph > "$OUT/last-build-requirements.txt"

      - name: Build the backend (PyInstaller)
        working-directory: backend
        run: |
          rm -rf build dist
          pyinstaller pyinstaller.spec --distpath dist --workpath build --noconfirm
          test -x dist/server/server || { echo "::error::frozen binary not found at backend/dist/server/server"; exit 1; }

      - name: "Smoke test: dependency imports"
        run: backend/dist/server/server --check-imports

      - name: Prepare test databases and secrets
        run: |
          python - <<'PY'
          import psycopg2
          conn = psycopg2.connect(host='127.0.0.1', user='postgres', password='ci', dbname='postgres')
          conn.autocommit = True
          with conn.cursor() as cur:
              for name in ('ci_fresh', 'ci_upgrade', 'ci_fixture'):
                  cur.execute(f'CREATE DATABASE {name}')
          print('created ci_fresh, ci_upgrade, ci_fixture')
          PY
          {
            echo "SECRET_KEY=ci-$RANDOM$RANDOM"
            echo "ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
            echo "ENABLE_AI_DEMOS=false"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/appdata"

      # Same steps, same order as install.sh on a brand-new server.
      - name: "Migration test: fresh install"
        env:
          DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/ci_fresh
          APP_DATA_DIR: ${{ runner.temp }}/appdata
          MIGRATIONS_DIR: ${{ github.workspace }}/backend/migrations
        run: |
          set -euo pipefail
          S=backend/dist/server/server
          [ "$($S --db-is-fresh)" = "true" ] || { echo "::error::a brand-new database did not report as fresh"; exit 1; }
          $S --seed-known-migrations
          $S --seed-initial-data | grep -v -i password
          $S --migrate-only
          # A second run must be a no-op, as on every later install.
          $S --migrate-only
          [ "$($S --db-is-fresh)" = "false" ] || { echo "::error::database still reports fresh after migrating"; exit 1; }
          echo "Fresh-install migrations OK."

      # Upgrade path: build the previous release's schema with the previous
      # release's own binary, then migrate it with this one. This is what
      # actually happens on production at every install.
      - name: "Migration test: upgrade from the previous release"
        env:
          DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/ci_upgrade
          APP_DATA_DIR: ${{ runner.temp }}/appdata
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ inputs.previous }}
        run: |
          set -euo pipefail
          if [ -z "$PREVIOUS" ] || ! gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" \
               --pattern 'server-bundle-*-linux-arm64.tar.gz' --dir "$RUNNER_TEMP/prev" 2>/dev/null; then
            echo "No server bundle for the previous release (${PREVIOUS:-none}), so there is no older schema to upgrade from yet. Skipped."
            echo "- Upgrade migration test: skipped (no previous server bundle)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tar -xzf "$RUNNER_TEMP"/prev/server-bundle-*.tar.gz -C "$RUNNER_TEMP/prev"
          OLD="$(find "$RUNNER_TEMP/prev" -mindepth 1 -maxdepth 1 -type d -name 'server-bundle-v*' | head -1)"
          echo "==> Building $PREVIOUS's schema with $PREVIOUS's own binary"
          MIGRATIONS_DIR="$OLD/migrations" "$OLD/backend/server" --seed-known-migrations
          MIGRATIONS_DIR="$OLD/migrations" "$OLD/backend/server" --seed-initial-data | grep -v -i password
          MIGRATIONS_DIR="$OLD/migrations" "$OLD/backend/server" --migrate-only
          echo "==> Upgrading it with this build"
          MIGRATIONS_DIR="$GITHUB_WORKSPACE/backend/migrations" backend/dist/server/server --migrate-only
          echo "- Upgrade migration test: $PREVIOUS -> $VERSION OK" >> "$GITHUB_STEP_SUMMARY"

      # Boots the real frozen server (gunicorn) on Postgres with sample
      # content. It stays running for the prerender and browser tests below.
      - name: Start the backend with sample content
        env:
          DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/ci_fixture
          APP_DATA_DIR: ${{ runner.temp }}/appdata
          MIGRATIONS_DIR: ${{ github.workspace }}/backend/migrations
        run: |
          set -euo pipefail
          S=backend/dist/server/server
          $S --seed-known-migrations
          $S --seed-initial-data | grep -v -i password
          $S --migrate-only
          (cd backend && python ci_fixture.py --manifest "$RUNNER_TEMP/fixture.json")
          GUNICORN_BIND=127.0.0.1:8099 GUNICORN_WORKERS=2 nohup "$S" > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/api/site-config || true)"
            if [ "$code" = "200" ]; then echo "Backend up (HTTP 200)."; exit 0; fi
            sleep 1
          done
          echo "::error::the frozen server did not answer /api/site-config with 200 within 30s"
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Install frontend packages
        working-directory: frontend
        run: npm ci

      - name: "Prerender test: build against the sample content"
        working-directory: frontend
        env:
          PRERENDER_BASE_URL: http://127.0.0.1:8099
        run: |
          npm run build
          node scripts/verify-prerender.mjs --manifest "$RUNNER_TEMP/fixture.json"
          node scripts/verify-csp-hashes.mjs

      - name: "Hydration test: open the pages in a real browser"
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          node scripts/verify-hydration.mjs --manifest "$RUNNER_TEMP/fixture.json" --api http://127.0.0.1:8099

      - name: Backend log (on failure)
        if: failure()
        run: cat "$RUNNER_TEMP/backend.log" 2>/dev/null || true

      - name: Stop the backend
        if: always()
        run: pkill -f 'backend/dist/server/server' || true

      - name: Package the server bundle
        run: bash deploy/scripts/assemble-release.sh --server-only --out "$OUT"

      # The generic build anyone can install: no prerendered pages, AI demos off.
      - name: Build and package the template
        working-directory: frontend
        env:
          VITE_ENABLE_AI_DEMOS: "false"
        run: |
          rm -rf build
          npm run build
          node scripts/verify-csp-hashes.mjs
          bash ../deploy/scripts/assemble-release.sh --from-server-bundle "$(ls "$OUT"/server-bundle-*.tar.gz)" \
            --frontend build/client --out "$OUT" --no-ai

      - name: Dependency changes
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ inputs.previous }}
        run: |
          mkdir -p "$RUNNER_TEMP/prevdeps"
          if [ -n "$PREVIOUS" ]; then
            gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --pattern last-build-requirements.txt \
              --dir "$RUNNER_TEMP/prevdeps" 2>/dev/null || true
            git show "$PREVIOUS:frontend/package-lock.json" > "$RUNNER_TEMP/prevdeps/package-lock.json" 2>/dev/null || true
          fi
          python .github/scripts/dependency-diff.py \
            --pip-old "$RUNNER_TEMP/prevdeps/last-build-requirements.txt" --pip-new "$OUT/last-build-requirements.txt" \
            --npm-old "$RUNNER_TEMP/prevdeps/package-lock.json" --npm-new frontend/package-lock.json \
            > "$OUT/dependency-changes.md"
          cat "$OUT/dependency-changes.md" >> "$GITHUB_STEP_SUMMARY"

      # Exactly these files, or the build stops here.
      - name: Check the release files are all here
        run: |
          cd "$OUT"
          ls -l
          missing=0
          for f in "server-bundle-v$VERSION-linux-arm64.tar.gz" "server-bundle-v$VERSION-linux-arm64.tar.gz.sha256" \
                   "personal-website-v$VERSION.tar.gz" "personal-website-v$VERSION.tar.gz.sha256" \
                   last-build-requirements.txt dependency-changes.md; do
            [ -f "$f" ] || { echo "::error::missing release file: $f"; missing=1; }
          done
          # Nothing else either: later jobs upload by pattern.
          count="$(find . -maxdepth 1 -type f -name '*.tar.gz' | wc -l)"
          [ "$count" -eq 2 ] || { echo "::error::expected exactly 2 tarballs, found $count"; missing=1; }
          [ "$missing" -eq 0 ] || exit 1
          sha256sum -c ./*.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact_name }}
          path: out/*
          if-no-files-found: error
          retention-days: 7
