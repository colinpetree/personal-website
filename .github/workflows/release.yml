name: Release

# Builds and tests the site's code once per version on an ARM64 runner (the
# same CPU and OS as production), then publishes a public GitHub Release
# holding:
#   - server-bundle-vX.Y.Z-linux-arm64.tar.gz: the frozen backend, migrations
#     and deploy files. Each site's private dist repo downloads this and adds
#     its own prerendered frontend (see build-instance.yml).
#   - personal-website-vX.Y.Z.tar.gz: the template build (no prerendered
#     pages, AI demos off), installable on any fresh server.
#
# Start it from the Actions tab: Release -> Run workflow, pick a branch in
# "Use workflow from" and a `bump`:
#   patch / minor / major  bump VERSION, tag and publish (main only). You never
#                          type a version number: it is worked out from VERSION.
#   trial                  build and test only; nothing is committed or published.
#                          Works on any branch.
#   test                   publish a test build of any branch as a PRE-release
#                          (vX.Y.Z-test.<branch>.<sha>) and send it to your own
#                          site to try live. No VERSION commit. See RELEASING.md.
#
# Order matters, as in the old publish-release.sh: everything is built and
# tested first; VERSION is committed, tagged and pushed only after that
# passes. A failed run never uses up a version number.
#
# PyInstaller cannot cross-compile, so the backend must be built on ARM64 to
# run on production's Graviton (t4g) servers.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "patch/minor/major release (main only), trial (test only), or test (try a branch on your site)"
        type: choice
        options: [patch, minor, major, trial, test]
        default: patch
      allow_migrations:
        description: "test only: allow a test build that adds database migrations (back up production first)"
        type: boolean
        default: false
  # TEMPORARY, Phase 1 only: every push to the CI/CD branch runs a trial, because
  # GitHub only offers "Run workflow" for workflows already on the default
  # branch. REMOVE this trigger before merging CI/CD into main.
  push:
    branches: ["CI/CD"]

permissions:
  contents: read

# One release at a time, so two runs can never pick the same next version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
      previous: ${{ steps.plan.outputs.previous }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: plan
        shell: bash
        env:
          BUMP: ${{ github.event_name == 'push' && 'trial' || inputs.bump }}
          ALLOW_MIGRATIONS: ${{ inputs.allow_migrations || false }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          current="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION is '$current'; it must look like 1.2.3"
            exit 1
          fi
          # The newest stable release tag reachable from main: the base for
          # the migration check and the dependency report.
          git fetch -q origin main
          previous="$(git tag --merged origin/main --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"

          IFS=. read -r major minor patch <<< "$current"
          case "$BUMP" in
            patch|minor|major)
              if [ "$BRANCH" != "main" ]; then
                echo "::error::A $BUMP release must run on main (this run is on '$BRANCH'). To try a branch, use bump: trial (tests only) or bump: test (deploys it to your site)."
                exit 1
              fi
              case "$BUMP" in
                major) major=$((major + 1)); minor=0; patch=0 ;;
                minor) minor=$((minor + 1)); patch=0 ;;
                patch) patch=$((patch + 1)) ;;
              esac
              version="$major.$minor.$patch"
              publish=true
              ;;
            test)
              # Lowercase; anything outside a-z 0-9 - becomes -, so CI/CD -> ci-cd.
              slug="$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+|-+$//g' | cut -c1-40)"
              # Base it on the newer of this branch's VERSION and the latest
              # stable release. A branch made before the latest release has an
              # older VERSION, and a test labelled older than what is live would
              # be replaced by that stable release on the site's next check.
              base="$current"
              if [ -n "$previous" ] && [ "$(printf '%s\n%s\n' "${previous#v}" "$current" | sort -V | tail -1)" != "$current" ]; then
                base="${previous#v}"
              fi
              version="$base-test.$slug.${GITHUB_SHA::7}"
              publish=true
              # A test build installs on your real site. install.sh takes no
              # database backup before migrating, and a migration cannot be
              # undone by going back to the stable release.
              if [ -n "$previous" ]; then
                added="$(git diff --name-only --diff-filter=A "$previous" HEAD -- backend/migrations/ || true)"
                if [ -n "$added" ] && [ "$ALLOW_MIGRATIONS" != "true" ]; then
                  echo "::error::This branch adds database migrations: $(echo "$added" | tr '\n' ' ')"
                  echo "::error::A test build would change the production database permanently, and install.sh takes no backup first. On production run: sudo systemctl start personal-website-backup  (then check it finished), and run this again with allow_migrations ticked."
                  exit 1
                fi
              fi
              ;;
            trial)
              version="$current"
              publish=false
              ;;
            *)
              echo "::error::Unknown bump '$BUMP'"
              exit 1
              ;;
          esac

          tag="v$version"
          if [ "$publish" = true ] && git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists. If an earlier run failed after tagging, delete the tag (git push --delete origin $tag) or bump again."
            exit 1
          fi

          {
            echo "mode=$BUMP"
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=$publish"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Release plan"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Mode | \`$BUMP\` |"
            echo "| Branch | \`$BRANCH\` @ \`${GITHUB_SHA::7}\` |"
            echo "| Version | $current -> **$version** |"
            echo "| Publishes | $publish |"
            echo "| Previous release | ${previous:-none} |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      OUT: ${{ github.workspace }}/out
    services:
      # Real Postgres for the migration and fixture tests. Production runs
      # Postgres; SQLite cannot run several of the .sql migrations at all.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-build.txt

      - name: Set VERSION for this build
        run: |
          echo "$VERSION" > VERSION
          mkdir -p "$OUT"

      # First, on its own: every package must have an ARM64 wheel (or build
      # from source here). A missing one should fail plainly at this step.
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-build.txt
          # The exact package set frozen into this release; the next release
          # diffs against it, and the dependency audit checks it.
          python -m pip freeze --exclude pyinstaller --exclude pyinstaller-hooks-contrib --exclude altgraph > "$OUT/last-build-requirements.txt"

      - name: Build the backend (PyInstaller)
        working-directory: backend
        run: |
          rm -rf build dist
          pyinstaller pyinstaller.spec --distpath dist --workpath build --noconfirm
          test -x dist/server/server || { echo "::error::frozen binary not found at backend/dist/server/server"; exit 1; }

      - name: "Smoke test: dependency imports"
        run: backend/dist/server/server --check-imports

      - name: Prepare test databases and secrets
        run: |
          python - <<'PY'
          import psycopg2
          conn = psycopg2.connect(host='127.0.0.1', user='postgres', password='ci', dbname='postgres')
          conn.autocommit = True
          with conn.cursor() as cur:
              for name in ('ci_fresh', 'ci_upgrade', 'ci_fixture'):
                  cur.execute(f'CREATE DATABASE {name}')
          print('created ci_fresh, ci_upgrade, ci_fixture')
          PY
          {
            echo "SECRET_KEY=ci-$RANDOM$RANDOM"
            echo "ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
            echo "ENABLE_AI_DEMOS=false"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/appdata"

      # Same steps, same order as install.sh on a brand-new server.
      - name: "Migration test: fresh install"
        env:
          DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/ci_fresh
          APP_DATA_DIR: ${{ runner.temp }}/appdata
          MIGRATIONS_DIR: ${{ github.workspace }}/backend/migrations
        run: |
          set -euo pipefail
          S=backend/dist/server/server
          [ "$($S --db-is-fresh)" = "true" ] || { echo "::error::a brand-new database did not report as fresh"; exit 1; }
          $S --seed-known-migrations
          $S --seed-initial-data | grep -v -i password
          $S --migrate-only
          # A second run must be a no-op, as on every later install.
          $S --migrate-only
          [ "$($S --db-is-fresh)" = "false" ] || { echo "::error::database still reports fresh after migrating"; exit 1; }
          echo "Fresh-install migrations OK."

      # Upgrade path: build the previous release's schema with the previous
      # release's own binary, then migrate it with this one. This is what
      # actually happens on production at every install.
      - name: "Migration test: upgrade from the previous release"
        env:
          DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/ci_upgrade
          APP_DATA_DIR: ${{ runner.temp }}/appdata
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ needs.prepare.outputs.previous }}
        run: |
          set -euo pipefail
          if [ -z "$PREVIOUS" ] || ! gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" \
               --pattern 'server-bundle-*-linux-arm64.tar.gz' --dir "$RUNNER_TEMP/prev" 2>/dev/null; then
            echo "No server bundle for the previous release (${PREVIOUS:-none}), so there is no older schema to upgrade from yet. Skipped."
            echo "- Upgrade migration test: skipped (no previous server bundle)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tar -xzf "$RUNNER_TEMP"/prev/server-bundle-*.tar.gz -C "$RUNNER_TEMP/prev"
          OLD="$(find "$RUNNER_TEMP/prev" -mindepth 1 -maxdepth 1 -type d -name 'server-bundle-v*' | head -1)"
          echo "==> Building $PREVIOUS's schema with $PREVIOUS's own binary"
          MIGRATIONS_DIR="$OLD/migrations" "$OLD/backend/server" --seed-known-migrations
          MIGRATIONS_DIR="$OLD/migrations" "$OLD/backend/server" --seed-initial-data | grep -v -i password
          MIGRATIONS_DIR="$OLD/migrations" "$OLD/backend/server" --migrate-only
          echo "==> Upgrading it with this build"
          MIGRATIONS_DIR="$GITHUB_WORKSPACE/backend/migrations" backend/dist/server/server --migrate-only
          echo "- Upgrade migration test: $PREVIOUS -> $VERSION OK" >> "$GITHUB_STEP_SUMMARY"

      # Boots the real frozen server (gunicorn) on Postgres with sample
      # content. It stays running for the prerender and browser tests below.
      - name: Start the backend with sample content
        env:
          DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/ci_fixture
          APP_DATA_DIR: ${{ runner.temp }}/appdata
          MIGRATIONS_DIR: ${{ github.workspace }}/backend/migrations
        run: |
          set -euo pipefail
          S=backend/dist/server/server
          $S --seed-known-migrations
          $S --seed-initial-data | grep -v -i password
          $S --migrate-only
          (cd backend && python ci_fixture.py --manifest "$RUNNER_TEMP/fixture.json")
          GUNICORN_BIND=127.0.0.1:8099 GUNICORN_WORKERS=2 nohup "$S" > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/api/site-config || true)"
            if [ "$code" = "200" ]; then echo "Backend up (HTTP 200)."; exit 0; fi
            sleep 1
          done
          echo "::error::the frozen server did not answer /api/site-config with 200 within 30s"
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Install frontend packages
        working-directory: frontend
        run: npm ci

      - name: "Prerender test: build against the sample content"
        working-directory: frontend
        env:
          PRERENDER_BASE_URL: http://127.0.0.1:8099
        run: |
          npm run build
          node scripts/verify-prerender.mjs --manifest "$RUNNER_TEMP/fixture.json"
          node scripts/verify-csp-hashes.mjs

      - name: "Hydration test: open the pages in a real browser"
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          node scripts/verify-hydration.mjs --manifest "$RUNNER_TEMP/fixture.json" --api http://127.0.0.1:8099

      - name: Backend log (on failure)
        if: failure()
        run: cat "$RUNNER_TEMP/backend.log" 2>/dev/null || true

      - name: Stop the backend
        if: always()
        run: pkill -f 'backend/dist/server/server' || true

      - name: Package the server bundle
        run: bash deploy/scripts/assemble-release.sh --server-only --out "$OUT"

      # The generic build anyone can install: no prerendered pages, AI demos off.
      - name: Build and package the template
        working-directory: frontend
        env:
          VITE_ENABLE_AI_DEMOS: "false"
        run: |
          rm -rf build
          npm run build
          node scripts/verify-csp-hashes.mjs
          bash ../deploy/scripts/assemble-release.sh --from-server-bundle "$(ls "$OUT"/server-bundle-*.tar.gz)" \
            --frontend build/client --out "$OUT" --no-ai

      - name: Dependency changes
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ needs.prepare.outputs.previous }}
        run: |
          mkdir -p "$RUNNER_TEMP/prevdeps"
          if [ -n "$PREVIOUS" ]; then
            gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --pattern last-build-requirements.txt \
              --dir "$RUNNER_TEMP/prevdeps" 2>/dev/null || true
            git show "$PREVIOUS:frontend/package-lock.json" > "$RUNNER_TEMP/prevdeps/package-lock.json" 2>/dev/null || true
          fi
          python .github/scripts/dependency-diff.py \
            --pip-old "$RUNNER_TEMP/prevdeps/last-build-requirements.txt" --pip-new "$OUT/last-build-requirements.txt" \
            --npm-old "$RUNNER_TEMP/prevdeps/package-lock.json" --npm-new frontend/package-lock.json \
            > "$OUT/dependency-changes.md"
          cat "$OUT/dependency-changes.md" >> "$GITHUB_STEP_SUMMARY"

      # Exactly these files, or the release stops here.
      - name: Check the release files are all here
        run: |
          cd "$OUT"
          ls -l
          missing=0
          for f in "server-bundle-v$VERSION-linux-arm64.tar.gz" "server-bundle-v$VERSION-linux-arm64.tar.gz.sha256" \
                   "personal-website-v$VERSION.tar.gz" "personal-website-v$VERSION.tar.gz.sha256" \
                   last-build-requirements.txt dependency-changes.md; do
            [ -f "$f" ] || { echo "::error::missing release file: $f"; missing=1; }
          done
          # Nothing else either: the release job uploads by pattern.
          count="$(find . -maxdepth 1 -type f -name '*.tar.gz' | wc -l)"
          [ "$count" -eq 2 ] || { echo "::error::expected exactly 2 tarballs, found $count"; missing=1; }
          [ "$missing" -eq 0 ] || exit 1
          sha256sum -c ./*.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # only this job may push the VERSION commit, tag and release
    env:
      MODE: ${{ needs.prepare.outputs.mode }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PREVIOUS: ${{ needs.prepare.outputs.previous }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: out

      - name: Check the files again
        run: |
          cd out
          ls -l
          sha256sum -c ./*.sha256

      # Same rule as publish-release.sh: commit and tag only now that the
      # build and every test passed, and push before the upload.
      - name: Commit VERSION, tag and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$MODE" = "test" ]; then
            # Test builds: tag the exact commit that was built, nothing else.
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
            exit 0
          fi
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::main moved while this release was building (built ${GITHUB_SHA::7}, main is now $(git rev-parse --short HEAD)). Nothing was published. Run the release again."
            exit 1
          fi
          echo "$VERSION" > VERSION
          git add VERSION
          git commit -m "Release $TAG"
          git tag "$TAG"
          git push origin HEAD:main
          git push origin "$TAG"

      - name: Write the release notes
        run: |
          {
            if [ "$MODE" = "test" ]; then
              echo "**TEST BUILD** of branch \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}. Not a release: it is a pre-release, so other sites never install it."
              echo ""
            fi
            echo "Changes: https://github.com/$GITHUB_REPOSITORY/compare/${PREVIOUS:-main}...$TAG"
            echo ""
            echo "- \`server-bundle-$TAG-linux-arm64.tar.gz\`: backend, migrations and deploy files. Each site's dist repo adds its own prerendered pages to this."
            echo "- \`personal-website-$TAG.tar.gz\`: template build (no prerendered pages, AI demos off), installable with install.sh."
            echo ""
            cat out/dependency-changes.md
          } > notes.md

      - name: Publish the release
        run: |
          flags=()
          [ "$MODE" = "test" ] && flags+=(--prerelease)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md "${flags[@]}" \
            out/server-bundle-*.tar.gz out/server-bundle-*.tar.gz.sha256 \
            out/personal-website-*.tar.gz out/personal-website-*.tar.gz.sha256 \
            out/last-build-requirements.txt

      # Stable releases clear away earlier test pre-releases and their tags.
      - name: Remove old test builds
        if: needs.prepare.outputs.mode != 'test'
        run: |
          # `|| true`: grep exits 1 when there are no test builds, which
          # pipefail would otherwise turn into a failed step.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' \
            | { grep -- '-test\.' || true; } | while read -r t; do
              echo "Deleting test pre-release $t"
              gh release delete "$t" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
            done

      # Optional: tell your own site's dist repo now instead of waiting for
      # its next scheduled check. Needs secret DIST_DISPATCH_TOKEN (a
      # fine-grained token with Actions: read and write on those repos) and
      # variable OWN_DIST_REPOS (space-separated owner/repo list).
      - name: Notify your dist repos
        env:
          DISPATCH_TOKEN: ${{ secrets.DIST_DISPATCH_TOKEN }}
          REPOS: ${{ vars.OWN_DIST_REPOS }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ] || [ -z "$REPOS" ]; then
            echo "DIST_DISPATCH_TOKEN or OWN_DIST_REPOS not set; dist repos will pick this up on their next scheduled run."
            exit 0
          fi
          for repo in $REPOS; do
            if [ "$MODE" = "test" ]; then
              GH_TOKEN="$DISPATCH_TOKEN" gh workflow run publish.yml --repo "$repo" -f test_tag="$TAG"
            else
              GH_TOKEN="$DISPATCH_TOKEN" gh workflow run publish.yml --repo "$repo"
            fi
            echo "Started publish.yml in $repo"
          done
