name: Publish release

# Turns the tested draft release into a real release. Nothing is built here.
#
# How a release happens:
#   1. Push to main. CI (ci.yml) builds and tests it, and if everything passes
#      leaves a draft release "Candidate <sha>, tested against <tag>" holding
#      the exact files it tested. Each new passing push replaces the draft.
#   2. When you want to release: Actions -> Publish release -> Run workflow
#      (leave "Use workflow from" on main) and pick patch, minor or major.
#      From a terminal: gh workflow run release.yml -f bump=patch
#
# This workflow then:
#   - works out the version from the newest release tag (there is no VERSION
#     file in the repo), e.g. v0.9.6 + minor = v0.10.0
#   - relabels the draft's files as that version
#     (deploy/scripts/reversion-release.sh: renames the files and the folder
#     inside, rewrites VERSION, and checks nothing else changed)
#   - tags the commit CI tested (no commit is pushed to main, so there is
#     nothing to pull afterwards)
#   - publishes the draft as the release, removes old test builds and tells
#     your dist repos.
#
# Draft titles (written by ci.yml's draft job):
#   Uploading <sha7>                        files still uploading; ignored here
#   Candidate <sha7>, tested against <tag>  complete, ready to publish
#   Publishing <sha7>, tested against <tag> claimed by a run of this workflow
# This workflow renames the Candidate it picks to "Publishing" before it tags
# anything, and CI never deletes a "Publishing" draft, so a push landing
# mid-publish can't pull the draft out from under it.
#
# Safe to run again if it fails partway: a "Publishing" draft is picked up
# first, and an existing tag on the same commit with no published release is
# carried on from. To give up on a claimed draft instead, delete it on the
# Releases page (and its tag, if one was pushed).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to raise"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

# Shared with CI's test builds (also started by hand), never with CI's
# automatic draft job: GitHub keeps one waiting run per group, and an
# automatic job in it would cancel a waiting Publish. Draft titles keep the
# two apart instead (see above).
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push the tag and publish the release
    env:
      BUMP: ${{ inputs.bump }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Find and check the tested draft
        id: plan
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Publish release must run on main (this run is on '$GITHUB_REF_NAME'). To try a branch, use Actions -> CI -> Run workflow with mode test."
            exit 1
          fi

          # Newest first. A draft an earlier run claimed comes before any
          # Candidate, so a failed publish is finished rather than abandoned.
          list="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,name \
            -q '.[] | select(.isDraft) | [.tagName, .name] | @tsv')"
          claimed_drafts="$(echo "$list" | awk -F'\t' '$2 ~ /^Publishing / { print $1 }')"
          candidates="$(echo "$list" | awk -F'\t' '$2 ~ /^Candidate / { print $1 }')"
          if [ -n "$claimed_drafts" ]; then
            if [ "$(echo "$claimed_drafts" | wc -l)" -gt 1 ]; then
              echo "::error::More than one draft is marked 'Publishing' ($(echo "$claimed_drafts" | tr '\n' ' ')). Delete the ones you don't want on the Releases page, then run this again."
              exit 1
            fi
            draft="$claimed_drafts"
            claimed=true
            echo "Carrying on with draft $draft, claimed by an earlier Publish release run."
          elif [ -n "$candidates" ]; then
            draft="$(echo "$candidates" | head -1)"
            claimed=false
          else
            echo "::error::No tested build waiting. Push to main and wait for CI to pass; it leaves a 'Candidate' draft release to publish."
            exit 1
          fi
          title="$(gh release view "$draft" --repo "$GITHUB_REPOSITORY" --json name -q .name)"
          sha="$(gh release view "$draft" --repo "$GITHUB_REPOSITORY" --json targetCommitish -q .targetCommitish)"
          tested_against="${title##*tested against }"

          # Every stop below: a draft this workflow already claimed needs a
          # way out, or every later run would keep picking it.
          fail() {
            echo "::error::$1"
            if [ "$claimed" = true ]; then
              echo "::error::Draft '$title' was claimed by an earlier Publish release run. To start over, delete it on the Releases page (and its tag, if one was pushed); the next CI run on main makes a new Candidate."
            fi
            exit 1
          }

          git fetch -q --tags origin main
          if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
            fail "The draft '$title' points at $sha, which is not in this repository."
          fi
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            fail "The draft '$title' was built from $sha, which is not on main (was main force-pushed?). Push to main again to get a new candidate."
          fi

          # Same rule CI uses: the newest stable tag reachable from main.
          stable_tags="$(git tag --merged origin/main --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V || true)"
          previous="$(echo "$stable_tags" | tail -1)"

          # Resuming after a failure partway through: an earlier attempt
          # already tagged this very commit but never finished publishing.
          # That tag is this release, not the one it was tested against.
          resume_tag=""
          if [ -n "$previous" ] && [ "$(git rev-list -n 1 "$previous")" = "$sha" ]; then
            if [ "$(gh release view "$previous" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || true)" = "false" ]; then
              fail "$previous is already published from this build (${sha::7}). Push to main to get a new candidate."
            fi
            resume_tag="$previous"
            previous="$(echo "$stable_tags" | grep -vx -- "$resume_tag" | tail -1 || true)"
            echo "An earlier run tagged ${sha::7} as $resume_tag without finishing: carrying on from there."
          fi

          if [ "$tested_against" != "${previous:-none}" ]; then
            fail "The draft was tested against ${tested_against}, but the newest release is now ${previous:-none}, so its upgrade-migration test is out of date. Re-run the latest CI run on main (Actions -> CI -> the run for ${sha::7} -> Re-run all jobs), then publish again."
          fi

          base="${previous#v}"
          base="${base:-0.0.0}"
          IFS=. read -r major minor patch <<< "$base"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "::error::Unknown bump '$BUMP'"; exit 1 ;;
          esac
          version="$major.$minor.$patch"
          tag="v$version"

          tag_exists=false
          if [ -n "$resume_tag" ]; then
            if [ "$resume_tag" != "$tag" ]; then
              echo "::error::An earlier run tagged ${sha::7} as $resume_tag, but this run's $BUMP bump gives $tag. Run again with the same bump as before, or delete the tag (git push --delete origin $resume_tag) to choose again."
              exit 1
            fi
            tag_exists=true
          elif git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            # Can only be a tag that isn't on main (main's tags are all
            # older than $previous by construction).
            fail "Tag $tag already exists on $(git rev-list -n 1 "$tag" | cut -c1-7), not on the tested commit ${sha::7}. If it is left over from something else, delete it (git push --delete origin $tag) and run this again."
          fi

          # Claim the draft, so CI's draft job won't delete it if a push lands
          # while this runs. Then read it back: if CI deleted it in the
          # moment between our list and the rename, stop before tagging.
          if [ "$claimed" = false ]; then
            gh release edit "$draft" --repo "$GITHUB_REPOSITORY" --title "Publishing ${title#Candidate }" >/dev/null \
              || { echo "::error::Could not claim draft $draft (it was probably replaced by a newer build just now). Run this again."; exit 1; }
            now="$(gh release view "$draft" --repo "$GITHUB_REPOSITORY" --json name -q .name 2>/dev/null || true)"
            if [[ "$now" != "Publishing "* ]]; then
              echo "::error::Draft $draft was replaced by a newer build while this started. Run this again."
              exit 1
            fi
            title="$now"
            claimed=true
          fi

          newer="$(git log --no-merges --format='- %h %s' "$sha..origin/main")"

          {
            echo "draft=$draft"
            echo "sha=$sha"
            echo "previous=$previous"
            echo "version=$version"
            echo "tag=$tag"
            echo "tag_exists=$tag_exists"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Release plan"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Draft | $title |"
            echo "| Commit | \`${sha::7}\` |"
            echo "| Version | ${previous:-none} -> **$tag** ($BUMP) |"
            echo ""
            if [ -n "$newer" ]; then
              echo "**Not included:** these commits on main came after the tested build. Their CI either failed or has not finished:"
              echo ""
              echo "$newer"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download and relabel the tested files
        env:
          DRAFT: ${{ steps.plan.outputs.draft }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          gh release download "$DRAFT" --repo "$GITHUB_REPOSITORY" --dir out
          ls -l out
          if ls out/server-bundle-v*-ci.*.tar.gz >/dev/null 2>&1; then
            # Drop any already-relabelled copies left by an earlier attempt;
            # they are made again from the tested originals.
            rm -f out/*-v"$VERSION"[.-]*
            (cd out && sha256sum -c ./*.sha256)
            bash deploy/scripts/reversion-release.sh out "$VERSION"
          elif [ -f "out/server-bundle-v$VERSION-linux-arm64.tar.gz" ] && [ -f "out/personal-website-v$VERSION.tar.gz" ]; then
            echo "The draft already holds the files relabelled as $VERSION (an earlier attempt got this far)."
          else
            echo "::error::The draft has neither the candidate files nor files for $VERSION."
            exit 1
          fi
          cd out
          ls -l
          sha256sum -c ./*.sha256

      - name: Tag the tested commit
        if: steps.plan.outputs.tag_exists != 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ steps.plan.outputs.sha }}
          DRAFT: ${{ steps.plan.outputs.draft }}
        run: |
          set -euo pipefail
          # Last check before anything permanent: the claimed draft must still
          # be there (CI re-reads a title right before deleting, but a delete
          # that started before our rename could still land).
          now="$(gh release view "$DRAFT" --repo "$GITHUB_REPOSITORY" --json name -q .name 2>/dev/null || true)"
          if [[ "$now" != "Publishing "* ]]; then
            echo "::error::Draft $DRAFT disappeared before tagging (replaced by a newer build). Nothing was tagged or published. Run this again."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "$SHA"
          git push origin "$TAG"

      - name: Write the release notes
        env:
          DRAFT: ${{ steps.plan.outputs.draft }}
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ steps.plan.outputs.sha }}
          PREVIOUS: ${{ steps.plan.outputs.previous }}
        run: |
          set -euo pipefail
          {
            echo "Changes: https://github.com/$GITHUB_REPOSITORY/compare/${PREVIOUS:-main}...$TAG"
            echo ""
            if [ -n "$PREVIOUS" ]; then
              echo "### Commits since $PREVIOUS"
              echo ""
              git log --no-merges --format='- %h %s' "$PREVIOUS..$SHA"
              echo ""
            fi
            echo "- \`server-bundle-$TAG-linux-arm64.tar.gz\`: backend, migrations and deploy files. Each site's dist repo adds its own prerendered pages to this."
            echo "- \`personal-website-$TAG.tar.gz\`: template build (no prerendered pages, AI demos off), installable with install.sh."
            echo ""
            # The dependency report CI wrote into the draft's notes.
            gh release view "$DRAFT" --repo "$GITHUB_REPOSITORY" --json body -q .body | tr -d '\r' \
              | sed -n '/^## Dependency changes since the previous release/,$p'
          } > notes.md

      # Swap the draft's files for the relabelled ones, then publish it.
      # The old -ci. files must be gone first: installers pick release files
      # by pattern (personal-website-*.tar.gz) and must find exactly one.
      - name: Publish the release
        env:
          DRAFT: ${{ steps.plan.outputs.draft }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "$DRAFT" --repo "$GITHUB_REPOSITORY" --clobber \
            "out/server-bundle-v$VERSION-linux-arm64.tar.gz" "out/server-bundle-v$VERSION-linux-arm64.tar.gz.sha256" \
            "out/personal-website-v$VERSION.tar.gz" "out/personal-website-v$VERSION.tar.gz.sha256"
          gh release view "$DRAFT" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' \
            | { grep -- '-ci\.' || true; } | while read -r a; do
              echo "Removing candidate file $a"
              gh release delete-asset "$DRAFT" "$a" --repo "$GITHUB_REPOSITORY" -y
            done
          gh release edit "$DRAFT" --repo "$GITHUB_REPOSITORY" --tag "$TAG" --title "$TAG" \
            --notes-file notes.md --draft=false --latest

          # Check what was published: not a draft, and exactly these files.
          [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" = "false" ] \
            || { echo "::error::$TAG is still a draft."; exit 1; }
          got="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | sort)"
          want="$(printf '%s\n' last-build-requirements.txt \
            "personal-website-v$VERSION.tar.gz" "personal-website-v$VERSION.tar.gz.sha256" \
            "server-bundle-v$VERSION-linux-arm64.tar.gz" "server-bundle-v$VERSION-linux-arm64.tar.gz.sha256" | sort)"
          if [ "$got" != "$want" ]; then
            echo "::error::$TAG has unexpected files:"
            echo "$got"
            exit 1
          fi
          echo "Published **$TAG**." >> "$GITHUB_STEP_SUMMARY"

      # Stable releases clear away earlier test pre-releases and their tags.
      - name: Remove old test builds
        run: |
          # `|| true`: grep exits 1 when there are no test builds, which
          # pipefail would otherwise turn into a failed step.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' \
            | { grep -- '-test\.' || true; } | while read -r t; do
              echo "Deleting test pre-release $t"
              gh release delete "$t" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
            done

      # Optional: tell your own site's dist repo now instead of waiting for
      # its next scheduled check. Needs secret DIST_DISPATCH_TOKEN (a
      # fine-grained token with Actions: read and write on those repos) and
      # variable OWN_DIST_REPOS (space-separated owner/repo list).
      - name: Notify your dist repos
        env:
          DISPATCH_TOKEN: ${{ secrets.DIST_DISPATCH_TOKEN }}
          REPOS: ${{ vars.OWN_DIST_REPOS }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ] || [ -z "$REPOS" ]; then
            echo "DIST_DISPATCH_TOKEN or OWN_DIST_REPOS not set; dist repos will pick this up on their next scheduled run."
            exit 0
          fi
          # --ref main: without it, gh first looks up the repo's default branch,
          # which needs "Contents: read". The token deliberately has only
          # "Actions: read and write", so that lookup fails (HTTP 403,
          # "Resource not accessible by personal access token").
          failed=0
          for repo in $REPOS; do
            if GH_TOKEN="$DISPATCH_TOKEN" gh workflow run publish.yml --repo "$repo" --ref main; then
              echo "Started publish.yml in $repo"
            else
              # The release above is already published and stays published;
              # only the "build now" message failed.
              echo "::error::Could not start publish.yml in $repo, but $TAG IS published. Start the build by hand there: Actions -> Publish site -> Run workflow. (Otherwise its next scheduled run picks it up.)"
              failed=1
            fi
          done
          exit "$failed"
