# Opens monthly pull requests for outdated dependencies. Each one runs the
# full CI (lint, unit tests, build, prerender, CSP and browser tests) before
# it can be merged, and nothing merges by itself.
#
# Packages that must move together get their own grouped PR, so they are
# reviewed as one deliberate upgrade:
#   - react / react-dom: pinned exactly; the per-page CSP script allowlist
#     depends on the exact build (frontend/scripts/inject-csp-hashes.mjs).
#     CI's verify-csp-hashes and browser tests check a bump.
#   - lexical / @lexical/*: pinned to one version; the custom editor nodes
#     are checked by src/components/admin/editor/nodes.test.jsx and the
#     admin browser test.
# Only MAJOR versions are ignored, and only where a major upgrade is a
# separate migration (Tailwind v4 is not used; React Router 8). Security fixes
# ship as minor/patch releases, so ignoring majors never hides one.
version: 2
updates:
  # Keeps the commit-SHA pins on GitHub Actions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      react:
        patterns: ["react", "react-dom"]
      lexical:
        patterns: ["lexical", "@lexical/*"]
      npm-minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ["react", "react-dom", "lexical", "@lexical/*"]
    ignore:
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: react-router
        update-types: ["version-update:semver-major"]
      - dependency-name: "@react-router/*"
        update-types: ["version-update:semver-major"]
