# Full template — install.sh substitutes __DOMAIN__, __SSL_CERT__,
# __SSL_KEY__, and __VARNISH_PORT__ before installing this to
# /etc/nginx/sites-available/. Only installed once a certificate already
# exists on disk (obtained via `certbot certonly --webroot` against the
# HTTP-only bootstrap config install.sh writes first) — never installed with
# placeholder cert paths, which nginx would refuse to load.

upstream varnish_upstream {
    server 127.0.0.1:__VARNISH_PORT__;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;

    # Mozilla "intermediate" TLS profile — https://ssl-config.mozilla.org/
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    client_max_body_size 20m;

    # ---- Compression ----
    # Static assets are precompressed at build time (vite-plugin-compression2,
    # see frontend/vite.config.js) — gzip_static/brotli_static serve those
    # .gz/.br siblings straight off disk with zero runtime CPU cost. Dynamic
    # gzip below is the live fallback for anything without a sibling, and
    # covers /api/* responses (brotli deliberately excluded there — see the
    # location /api/ block).
    gzip_static on;
    brotli_static on;

    gzip on;
    # Default gzip_proxied is "off" for proxied responses — without this,
    # /api/* gets zero compression even with gzip on. Safe as "any" here:
    # this is a fully trusted, same-origin proxy chain (nginx -> Varnish ->
    # gunicorn), not a third-party backend.
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json
               image/svg+xml application/xml text/xml application/wasm
               font/woff2 text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # Backstop against stored-XSS in admin-authored content (blog posts,
    # uploaded SVGs): no inline/eval script, and only known third-party
    # script/frame sources (Stripe embedded checkout; YouTube/Vimeo/Spotify
    # embeds via the blog editor). Widen this if a new embed type is added.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com; frame-src https://js.stripe.com https://www.youtube.com https://player.vimeo.com https://open.spotify.com; connect-src 'self' https://api.stripe.com; img-src 'self' data: https:; media-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'self'; object-src 'none'" always;

    root /opt/personal-website/current/frontend/dist;

    # Vite's hashed filenames — bypass Varnish entirely, nginx serves +
    # caches directly since content-addressed filenames never need a purge.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Streaming AI demo responses (backend/routes/ai_demo.py) already send
    # X-Accel-Buffering: no, but that alone isn't reliable enough to depend on
    # (a future route could forget it) — this location makes the buffering
    # behavior explicit and scoped to just the routes that actually stream,
    # matched ahead of the general /api/ block below since nginx picks the
    # longest matching prefix location regardless of file order. Kept
    # separate from /api/ rather than turning proxy_buffering off there too:
    # /api/uploads/ (also under /api/) serves files up to 20MB
    # (client_max_body_size), and buffering those protects gunicorn/Varnish
    # workers on this small box from being tied up by a slow client's
    # download — a concern that doesn't apply to short-lived AI demo replies.
    location /api/ai-demo/ {
        proxy_pass http://varnish_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # Consumed by Flask's ProxyFix (backend/app.py) to recover the real
        # visitor IP for the login/contact-form rate limiters — Varnish sits
        # between here and gunicorn but never touches this header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_buffering off;
    }

    # All /api/ (including /api/uploads/) go through Varnish, not directly to
    # gunicorn — Varnish's VCL is the single place deciding cacheability, so
    # nginx doesn't need to duplicate the ?name= download-vs-fetch branching
    # uploads.py implements.
    location /api/ {
        proxy_pass http://varnish_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # Consumed by Flask's ProxyFix (backend/app.py) to recover the real
        # visitor IP for the login/contact-form rate limiters — Varnish sits
        # between here and gunicorn but never touches this header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    # SPA fallback for everything else — client-side routed deep links.
    # $uri/ (added for SSG prerendering) lets a prerendered route's static
    # HTML (e.g. dist/my-post/index.html) actually get served instead of
    # always falling through to the generic shell below. A request without
    # a trailing slash 301-redirects to add one — standard, expected SSG
    # behavior, not a bug.
    #
    # Falls back to __spa-fallback.html first, NOT index.html — index.html
    # is itself a prerendered page (the home route's own static HTML, with
    # home-page content and __reactRouterContext baked in for "/"
    # specifically). Serving it for an unrelated unprerendered route (e.g.
    # /admin) would briefly tell the client router it's on the home route.
    # __spa-fallback.html is the actual route-agnostic bootstrap shell
    # React Router's build emits for exactly this case — confirmed by
    # diffing the two files' emitted content during implementation.
    #
    # BUT: __spa-fallback.html only exists when the build has a MIX of
    # prerendered and non-prerendered routes. The generic/template build
    # profile (PRERENDER_BASE_URL unset -> prerender() returns []) has
    # nothing prerendered at all, so react-router build never emits that
    # file — index.html alone is the shell in that case. Confirmed by
    # actually building both profiles: the try_files chain below needs
    # /index.html as a final fallback, or the generic profile 500s/errors
    # on every single page. Safe as a final entry (not a redirect loop):
    # /index.html always exists and is matched by the first $uri check on
    # its own internal re-dispatch.
    location / {
        # Brotli scoped to this block deliberately, not server-level — it
        # must never apply to /api/* (proxied dynamic responses stay
        # gzip-only, see the compression block above) since dynamic brotli
        # compression is markedly more CPU-expensive per-request than gzip
        # and not worth that cost on every API call on this ARM box.
        brotli on;
        brotli_types text/css application/javascript text/javascript application/json
                     image/svg+xml application/xml text/xml application/wasm
                     font/woff2 text/plain;
        try_files $uri $uri/ /__spa-fallback.html /index.html;
    }
}
