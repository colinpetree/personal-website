# Full template — install.sh substitutes __DOMAIN__, __SSL_CERT__,
# __SSL_KEY__, and __BACKEND_PORT__ before installing this to
# /etc/nginx/sites-available/. Only installed once a certificate already
# exists on disk (obtained via `certbot certonly --webroot` against the
# HTTP-only bootstrap config install.sh writes first) — never installed with
# placeholder cert paths, which nginx would refuse to load.

upstream varnish_upstream {
    server 127.0.0.1:__BACKEND_PORT__;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;

    # Mozilla "intermediate" TLS profile — https://ssl-config.mozilla.org/
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    client_max_body_size 20m;

    # ---- Compression ----
    # Static assets are precompressed at build time (vite-plugin-compression2,
    # see frontend/vite.config.js) — gzip_static/brotli_static serve those
    # .gz/.br siblings straight off disk with zero runtime CPU cost. Dynamic
    # gzip below is the live fallback for anything without a sibling, and
    # covers /api/* responses (brotli deliberately excluded there — see the
    # location /api/ block).
    gzip_static on;
    brotli_static on;

    gzip on;
    # Default gzip_proxied is "off" for proxied responses — without this,
    # /api/* gets zero compression even with gzip on. Safe as "any" here:
    # this is a fully trusted, same-origin proxy chain (nginx -> Varnish ->
    # gunicorn), not a third-party backend.
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json
               image/svg+xml application/xml text/xml application/wasm
               font/woff2 text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    root /opt/personal-website/current/frontend/dist;

    # Vite's hashed filenames — bypass Varnish entirely, nginx serves +
    # caches directly since content-addressed filenames never need a purge.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # All /api/ (including /api/uploads/) go through Varnish, not directly to
    # gunicorn — Varnish's VCL is the single place deciding cacheability, so
    # nginx doesn't need to duplicate the ?name= download-vs-fetch branching
    # uploads.py implements.
    location /api/ {
        proxy_pass http://varnish_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    # SPA fallback for everything else — client-side routed deep links.
    location / {
        # Brotli scoped to this block deliberately, not server-level — it
        # must never apply to /api/* (proxied dynamic responses stay
        # gzip-only, see the compression block above) since dynamic brotli
        # compression is markedly more CPU-expensive per-request than gzip
        # and not worth that cost on every API call on this ARM box.
        brotli on;
        brotli_types text/css application/javascript text/javascript application/json
                     image/svg+xml application/xml text/xml application/wasm
                     font/woff2 text/plain;
        try_files $uri /index.html;
    }
}
